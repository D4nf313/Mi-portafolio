<section class="contact-section">
  <h2 class="section-title">{{ lang.t('contact.title') }}</h2>
  <div class="section-divider"></div>

  <mat-card class="contact-card">
    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline">
        <mat-label>{{ lang.t('contact.name') }}</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ lang.t('contact.email') }}</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>{{ lang.t('contact.message') }}</mat-label>
        <textarea matInput rows="5" formControlName="message"></textarea>
      </mat-form-field>

      <button mat-raised-button color="primary" [disabled]="contactForm.invalid">
        {{ lang.t('contact.send') }}
      </button>
    </form>
  </mat-card>
</section>
