<section class="experience-section">
  <h2 class="section-title">{{ lang.t('experience.title') }}</h2>
  <div class="section-divider"></div>

  <div class="timeline">
    <div class="timeline-item" *ngFor="let exp of experiences">
      <div class="timeline-marker"></div>
      <div class="timeline-content">
        <h3 class="company">{{ exp.company }}</h3>
        <span class="date">{{ exp.date }}</span>
        <p class="role">{{ exp.role }} · {{ exp.location }}</p>
        <ul class="experience-list">
          <li *ngFor="let item of exp.details">{{ item }}</li>
        </ul>
      </div>
    </div>
  </div>
</section>
