<section class="projects-section">
  <h2 class="section-title">{{ lang.t('projects.title') }}</h2>
  <div class="section-divider"></div>

  <div class="carousel-container">

    <button class="arrow arrow--left" (click)="scroll('left')" aria-label="Anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>

    <div class="carousel-track" #track>
      <div class="project-card" *ngFor="let project of projects">

        <div class="card-preview">
          <div class="browser-bar">
            <div class="browser-dots">
              <span class="dot dot--red"></span>
              <span class="dot dot--yellow"></span>
              <span class="dot dot--green"></span>
            </div>
            <div class="browser-url">{{ project.liveUrl ?? 'localhost:4200' }}</div>
          </div>
          <div class="preview-image" [style.--project-color]="project.color">
            <img
              *ngIf="project.screenshot"
              [src]="project.screenshot"
              [alt]="project.nameKey + ' preview'"
              class="screenshot"
            />
            <div *ngIf="!project.screenshot" class="screenshot-placeholder">
              <span class="placeholder-emoji">{{ project.emoji }}</span>
            </div>
          </div>
        </div>

        <div class="card-body">
          <div class="card-header">
            <div class="title-row">
              <h3 class="project-name">{{ project.nameKey }}</h3>
              <span *ngIf="project.liveUrl" class="badge-deployed">{{ lang.t('projects.deployed') }}</span>
            </div>
            <span class="project-type">{{ lang.t(project.typeKey) }}</span>
          </div>

          <p class="project-desc">{{ lang.t(project.descKey) }}</p>

          <div class="stack-chips">
            <span class="chip" *ngFor="let tech of project.stack">{{ tech }}</span>
          </div>

          <div class="card-actions">
            <button class="btn btn--outline" (click)="openLink(project.githubUrl)">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
              </svg>
              {{ lang.t('projects.repo') }}
            </button>
            <button *ngIf="project.liveUrl" class="btn btn--primary" (click)="openLink(project.liveUrl)">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" y1="14" x2="21" y2="3"/>
              </svg>
              {{ lang.t('projects.live') }}
            </button>
          </div>
        </div>

      </div>
    </div>

    <button class="arrow arrow--right" (click)="scroll('right')" aria-label="Siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>

  </div>
</section>
