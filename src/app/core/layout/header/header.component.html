<mat-toolbar class="navbar">
  <span class="logo">
    <img
      src="../../../../assets/logodf3.jpg"
      alt="Logo"
      class="logo-img"
    >
  </span>

  <span class="spacer"></span>

  <nav class="nav-links">
    <a
      mat-button
      routerLink="/portafolio-daniel-suarez-full-stack"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >{{ lang.t('nav.home') }}</a>

    <a
      mat-button
      routerLink="/portafolio-daniel-suarez-full-stack/about"
      routerLinkActive="active"
    >{{ lang.t('nav.about') }}</a>

    <a
      mat-button
      routerLink="/portafolio-daniel-suarez-full-stack/experience"
      routerLinkActive="active"
    >{{ lang.t('nav.experience') }}</a>

    <a
      mat-button
      routerLink="/portafolio-daniel-suarez-full-stack/projects"
      routerLinkActive="active"
    >{{ lang.t('nav.projects') }}</a>

    <a
      mat-button
      routerLink="/portafolio-daniel-suarez-full-stack/contact"
      routerLinkActive="active"
    >{{ lang.t('nav.contact') }}</a>
  </nav>

  <div class="header-actions">
    <div class="lang-switcher">
      <button (click)="lang.setLang('es')" [class.active]="lang.lang() === 'es'">ES</button>
      <span>|</span>
      <button (click)="lang.setLang('en')" [class.active]="lang.lang() === 'en'">EN</button>
    </div>

    <button class="theme-toggle" (click)="theme.toggle()">
      {{ theme.isDark() ? '🌙' : '☀️' }}
    </button>
  </div>
</mat-toolbar>
